/* ------------------------------------------------------------- normalising */

/**
 * Newlines survive normalisation on purpose.
 *
 * The recorder writes one line per settled utterance, and an utterance boundary
 * is the only sentence boundary dictated Hebrew reliably has — nobody says
 * "נקודה" on a round. Collapsing them with the rest of the whitespace turns a
 * whole round into a single clause, which then mis-files everything into
 * whichever categories the first cue words happened to open.
 */
function normalise(raw) {
  return raw
    .replace(/[֑-ׇ]/g, "") // niqqud / cantillation
    .replace(/[״"]/g, '"')
    .replace(/[׳']/g, "'")
    .replace(/[^\S\n]+/g, " ")
    .replace(/ *\n+ */g, "\n")
    .trim();
}

/** Verbs that start a new action when carrying a vav prefix: "נעשה צילום חזה
 *  ונחזור על ספירת דם" is two orders, not one. */
const VAV_ACTION =
  /\s+(?=ו(?:נעשה|נבצע|נשלח|נזמין|נחזור|נתחיל|נמשיך|נוסיף|נפסיק|נשקול|נוריד|נעלה)(?![֐-׿]))/;

const TIMING_RE = heb(
  "עכשיו|מיד|מייד|בדחיפות|דחוף|היום|הבוקר|הערב|הלילה|מחר\\s*בבוקר|מחר|מחרתיים|בהמשך\\s*השבוע",
);
const TIMING_PHRASE_RE = /לפני\s*ה?שחרור|אחר\s*ה?צהריים/;

function timingIn(text) {
  const phrase = text.match(TIMING_PHRASE_RE);
  if (phrase) return phrase[0];
  const word = text.match(TIMING_RE);
  return word ? word[0] : null;
}

/** Splits speech into clauses. Doctors dictate in runs without punctuation, so
 *  conjunctions that reliably start a new statement are cut points too. */
function clauses(text) {
  const sentences = text.split(/[.;!?\n]+/).map((s) => s.trim()).filter(Boolean);
  const out = [];
  for (const sentence of sentences) {
    const sentenceTiming = timingIn(sentence);
    const parts = sentence
      .split(/[,]+|\s+(?=אבל\s|ובנוסף\s|בנוסף\s|וכן\s)/)
      .flatMap((p) => p.split(VAV_ACTION))
      .map((p) => p.trim())
      .filter((p) => p.length > 1);
    for (const t of parts) out.push({ text: t, sentenceTiming });
  }
  return out;
}

const has = (text, re) => re.test(text);

/* ------------------------------------------------------------------ vitals */

function extractVitals(text, out) {
  const temp = text.match(/(?<![֐-׿])חום\s*(?:של\s*|היה\s*|הגיע\s*ל\s*)?(\d{2}(?:[.,]\d)?)/);
  if (temp) out.vitals.temperature = `${temp[1].replace(",", ".")}°C`;

  const bp = text.match(/לחץ\s*ה?דם\s*(?:הוא\s*|היה\s*|של\s*)?(\d{2,3})\s*(?:על|\/|\\)\s*(\d{2,3})/);
  if (bp) out.vitals.bloodPressure = `${bp[1]}/${bp[2]}`;

  const hr = text.match(/(?<![֐-׿])דופק\s*(?:של\s*|הוא\s*|היה\s*)?(\d{2,3})/);
  if (hr) out.vitals.heartRate = hr[1];

  const spo2 = text.match(/(?:סטורציה|סאטורציה|ריווי\s*חמצן|סאט)\s*(?:של\s*|הוא\s*|היא\s*)?(\d{2,3})\s*%?/);
  if (spo2) {
    const roomAir = has(text, /באוויר\s*חדר|ללא\s*חמצן/);
    out.vitals.spo2 = `${spo2[1]}%${roomAir ? " באוויר חדר" : ""}`;
  }

  const rr = text.match(/(?:קצב\s*נשימה|קצב\s*נשימות|נשימות\s*ל?דקה)\s*(?:של\s*|הוא\s*)?(\d{1,2})/);
  if (rr) out.vitals.respiratoryRate = rr[1];
}

/* -------------------------------------------------------- past medical hx  */

const CONDITIONS = [
  [/סוכרת|סכרת/, "סוכרת"],
  [/יתר\s*לחץ\s*דם|לחץ\s*דם\s*גבוה|יל"?ד/, "יתר לחץ דם"],
  [/\bCOPD\b|קופ"?ד|מחלת\s*ריאות\s*חסימתית/i, "COPD"],
  [/אסתמה|אסטמה/, "אסתמה"],
  [/אי\s*ספיקת\s*לב/, "אי ספיקת לב"],
  [/אי\s*ספיקת\s*כליות|מחלת\s*כליות\s*כרונית/, "מחלת כליות כרונית"],
  [/פרפור\s*פרוזדורים|פרפור\s*עליות/, "פרפור פרוזדורים"],
  [/דיסליפידמיה|היפרליפידמיה|כולסטרול\s*גבוה/, "דיסליפידמיה"],
  [/היפותירואידיזם|תת\s*פעילות\s*של\s*בלוטת\s*התריס/, "היפותירואידיזם"],
  [/דמנציה|אלצהיימר/, "דמנציה"],
  [/אוסטאופורוזיס|בריחת\s*סידן/, "אוסטאופורוזיס"],
  [/השמנה|עודף\s*משקל/, "השמנה"],
  [/שבץ|אירוע\s*מוחי|CVA/i, "אירוע מוחי בעבר"],
  [/אוטם\s*שריר\s*הלב|התקף\s*לב|MI\b/i, "מחלת לב איסכמית"],
  [/דיכאון/, "דיכאון"],
  [/אנמיה/, "אנמיה"],
];

const HISTORY_CUE = /ברקע|רקע\s*של|סובל\s*מ|סובלת\s*מ|ידוע\s*(?:כ|על)|היסטוריה\s*של|מוכר\s*עם/;

function extractHistory(clause, out) {
  if (!has(clause, HISTORY_CUE)) return;
  for (const [pattern, label] of CONDITIONS) {
    if (pattern.test(clause)) out.pastMedicalHistory.push(label);
  }
}

/* ----------------------------------------------------------------- social  */

const SOCIAL_RULES = [
  [/גר\s*לבד|גרה\s*לבד|חי\s*לבד/, "גר לבד"],
  [/גר\s*עם\s*(אשתו|בעלה|בתו|בנו|משפחתו|בת\s*זוגו|בן\s*זוגה)/, (m) => `גר עם ${m[1]}`],
  [/(?:ה?בת|בתו)\s*(?:שלו|שלה)?\s*(?:עוזרת|מסייעת|מטפלת)/, "בתו מסייעת לו"],
  [/(?:ה?בן|בנו)\s*(?:שלו|שלה)?\s*(?:עוזר|מסייע|מטפל)/, "בנו מסייע לו"],
  [/עצמאי\s*(?:בתפקודי|ב)?|עצמאית\s*(?:בתפקודי|ב)?/, "עצמאי בתפקודי יום יום"],
  [/נעזר\s*ב?מטפל|מטפלת\s*צמודה|עובד\s*זר/, "נעזר במטפל"],
  [/מעשן|מעשנת/, "מעשן"],
  [/לא\s*מעשן|לא\s*מעשנת|הפסיק\s*לעשן/, "לא מעשן"],
  [/שותה\s*אלכוהול|צריכת\s*אלכוהול/, "צריכת אלכוהול"],
  [/בית\s*אבות|מוסד\s*סיעודי|דיור\s*מוגן/, "מתגורר במסגרת סיעודית"],
  [/תמיכה\s*משפחתית|משפחה\s*תומכת/, "תמיכה משפחתית"],
  [/מרותק\s*למיטה|מרותקת\s*למיטה/, "מרותק למיטה"],
];

function extractSocial(clause, out) {
  for (const [pattern, label] of SOCIAL_RULES) {
    const m = clause.match(pattern);
    if (m) out.socialStatus.push(typeof label === "function" ? label(m) : label);
  }
}

/* ---------------------------------------------------------------- symptoms */

const SYMPTOMS = [
  [/משתעל|משתעלת|שיעול/, "שיעול מתמשך"],
  [/קוצר\s*נשימה|קשה\s*לו\s*לנשום|מתנשם/, "קוצר נשימה"],
  [/כאב\s*בחזה|כאבים\s*בחזה/, "כאב בחזה"],
  [/כאב\s*בטן|כאבי\s*בטן/, "כאב בטן"],
  [/כאב\s*ראש|כאבי\s*ראש/, "כאב ראש"],
  [/בחילה|בחילות|הקאות/, "בחילות"],
  [/סחרחורת|סחרחורות/, "סחרחורות"],
  [/חולשה|תשישות/, "חולשה כללית"],
  [/בלבול|מבולבל|מבולבלת/, "בלבול"],
  [/בצקות|נפיחות\s*ברגליים/, "בצקות"],
  [/צריבה\s*ב?מתן\s*שתן|שריפה\s*בהשתנה/, "צריבה במתן שתן"],
];

const RESOLVED_CUE = /חלף|נעלם|הסתדר|ללא\s|אין\s|שיפור\s*ב/;

function extractSymptoms(clause, out) {
  // "עדיין משתעל" and "כבר לא משתעל" are opposite claims; only the first is a
  // current complaint, so a negation nearby suppresses the match.
  if (has(clause, /\bלא\s|אינו\s|אינה\s/) && !has(clause, /עדיין|ממשיך|נמשך/)) return;
  if (has(clause, RESOLVED_CUE) && !has(clause, /עדיין|ממשיך/)) return;

  for (const [pattern, label] of SYMPTOMS) {
    if (pattern.test(clause)) out.chiefComplaint.push(label);
  }
}

/* ------------------------------------------------------------------- tests */

const IMAGING =
  /צילום\s*חזה|צילום|\bCT\b|סי\s*טי|סיטי|\bMRI\b|אם\s*אר\s*איי|אולטרסאונד|\bUS\b|דופלר|אקו(?:\s*לב)?|מיפוי|MRCP/i;
const LABS =
  /ספירת\s*דם|כימיה|תפקודי\s*כבד|תפקודי\s*כליה|קריאטינין|אלקטרוליטים|\bCRP\b|תרבית|גזים\s*בדם|\bINR\b|המוגלובין|נתרן|אשלגן|סוכר\s*בדם|ליפאז|בילירובין|\bBNP\b|טרופונין/i;
const OTHER_TESTS = /\bECG\b|אק"?ג|אקג|הולטר|ספירומטריה|בדיקת\s*בליעה|בדיקה\s*נוירולוגית|קרקעית\s*עין/i;

const EXAM_CUE = /בבדיקה|בבדיקה\s*גופנית|בהאזנה|נשמע|נשמעים|במישוש|רגישות\s*ב|חרחורים|צפצופים|אוושה/;
const PLAN_CUE =
  /נעשה|נבצע|נשלח|נזמין|נחזור\s*על|נמשיך|נתחיל|נוסיף|נוריד|נפסיק|יש\s*לבצע|יש\s*לשלוח|צריך\s*ל|לבצע|לשלוח|להזמין|נשקול/;
const REPEAT_CUE = /נחזור\s*על|חוזר|חוזרת|שוב|בשנית/;

/** Pulls the test name out of an action clause, dropping the verb and timing so
 *  the resulting task title is what a doctor would write on the sheet. */
function testPhrase(clause) {
  const cleaned = clause
    .replace(
      /^(?:אז\s*)?ו?(?:נעשה|נבצע|נשלח|נזמין|נחזור\s*על|יש\s*לבצע|יש\s*לשלוח|צריך\s*לבצע|צריך\s*לשלוח|לבצע|לשלוח|להזמין|נשקול)\s*/,
      "",
    )
    .replace(
      /\s*(?:(?<![֐-׿])(?:עכשיו|מיד|מייד|בדחיפות|היום|הבוקר|הערב|הלילה|מחר\s*בבוקר|מחר|מחרתיים)(?![֐-׿])|לפני\s*ה?שחרור|בהמשך\s*השבוע)\s*/g,
      " ",
    )
    .replace(/^ו/, "")
    .replace(/\s+/g, " ")
    .trim();
  return cleaned.length > 1 ? cleaned : null;
}

function categoryOf(phrase) {
  if (IMAGING.test(phrase)) return "imaging";
  if (LABS.test(phrase)) return "labs";
  return "other";
}

function extractTestsAndPlan(clause, out) {
  const text = clause.text;
  if (has(text, EXAM_CUE)) {
    out.tests.physicalExam.push(text.replace(/^בבדיקה\s*(?:גופנית\s*)?/, "").trim());
    return;
  }
  if (!has(text, PLAN_CUE)) return;

  const phrase = testPhrase(text);
  if (!phrase) return;

  const timing = clause.sentenceTiming;
  const repeat = has(text, REPEAT_CUE);

  if (IMAGING.test(phrase)) {
    out.tests.imaging.push(repeat ? `${phrase} חוזר` : `${phrase} מתוכנן`);
  } else if (LABS.test(phrase)) {
    out.tests.labs.push(repeat ? `${phrase} חוזרת` : `${phrase} מתוכננת`);
  } else if (OTHER_TESTS.test(phrase)) {
    out.tests.otherTests.push(repeat ? `${phrase} חוזר` : `${phrase} מתוכנן`);
  }

  // The plan keeps the doctor's own phrasing including timing; the task is the
  // bare actionable noun.
  out.treatmentPlan.push(timing ? `${phrase} ${timing}` : phrase);
  out.tasks.push({ title: phrase, timing, category: categoryOf(phrase) });
}

/* ------------------------------------------------------- working diagnosis */

const DIAGNOSIS_CUE =
  /כנראה|ככל\s*הנראה|חשד\s*ל|נראה\s*כמו|מדובר\s*ב|האבחנה\s*היא|אבחנה\s*מבדלת|להערכתי/;

function extractDiagnosis(clause, out) {
  if (!has(clause, DIAGNOSIS_CUE)) return;
  const phrase = clause
    .replace(/^.*?(?:כנראה|ככל\s*הנראה|חשד\s*ל|נראה\s*כמו|מדובר\s*ב|האבחנה\s*היא|להערכתי)\s*/, "")
    .trim();
  if (phrase.length < 2) return;
  // Hedged speech becomes an explicitly hedged diagnosis, not a firm one.
  const hedged = has(clause, /כנראה|ככל\s*הנראה|חשד\s*ל|נראה\s*כמו|להערכתי/);
  out.workingDiagnosis.push(hedged ? `חשד ל${phrase}` : phrase);
}

/* -------------------------------------------------------------- treatment  */

const MED_CUE =
  /נתחיל|ניתן|נמשיך|נפסיק|נוריד|נעלה|מינון|אנטיביוטיקה|סטרואידים|משתן|פוסיד|אינהלציות|נוזלים|חמצן/;

function extractTreatment(clause, out) {
  if (!has(clause, MED_CUE)) return;
  if (has(clause, PLAN_CUE) && (IMAGING.test(clause) || LABS.test(clause))) return;
  const phrase = clause.replace(/^(?:אז\s*)?/, "").trim();
  if (phrase.length > 1) out.treatmentPlan.push(phrase);
}

/* ------------------------------------------------------------- consultants */

const SPECIALTIES = [
  [/קרדיולוג|קרדיולוגיה|רופא\s*לב/, "קרדיולוגיה"],
  [/ריאות|פולמונולוג|ריאתי/, "ריאות"],
  [/נפרולוג|נפרולוגיה|כליות/, "נפרולוגיה"],
  [/פיזיותרפי/, "פיזיותרפיה"],
  [/עבודה\s*סוציאלית|עו"?ס|עובדת\s*סוציאלית/, "עבודה סוציאלית"],
  [/גסטרו|גסטרואנטרולוג/, "גסטרואנטרולוגיה"],
  [/נוירולוג/, "נוירולוגיה"],
  [/כירורג/, "כירורגיה"],
  [/אנדוקרינולוג|סוכרת\s*יועץ/, "אנדוקרינולוגיה"],
  [/זיהומיות|זיהומולוג/, "זיהומיות"],
  [/תזונאי|דיאטנית/, "תזונה"],
  [/ריפוי\s*בעיסוק/, "ריפוי בעיסוק"],
];

const CONSULT_CUE = /ייעוץ|יעוץ|נזמין|נבקש|להזמין|נתייעץ|יבוא\s*לראות|הערכת/;

function extractConsults(clause, out) {
  const text = clause.text;
  if (!has(text, CONSULT_CUE)) return;
  for (const [pattern, specialty] of SPECIALTIES) {
    if (pattern.test(text)) {
      out.consultations.push({ specialty, reason: null });
      out.tasks.push({ title: `ייעוץ ${specialty}`, timing: clause.sentenceTiming, category: "consult" });
    }
  }
}

/* --------------------------------------------------------------- discharge */

function extractDischarge(clause, out) {
  if (!has(clause, /שחרור|לשחרר|משחררים|הביתה/)) return;

  if (has(clause, /לא\s*משחררים|לא\s*לשחרר|אין\s*שחרור|רחוק\s*משחרור/)) {
    out.discharge.status = "unplanned";
  } else if (has(clause, /מחר|מחרתיים/)) {
    out.discharge.status = "tomorrow";
  } else if (has(clause, /היום|עכשיו|הבוקר/)) {
    out.discharge.status = "today";
  }

  const blocker = clause.match(/(?:ממתין|ממתינים|מחכים)\s*ל[־\s]*(.+?)(?:$|\s+(?:ואז|אחר\s*כך))/);
  if (blocker && blocker[1]) out.discharge.blockers.push(`ממתין ל${blocker[1].trim()}`);

  if (has(clause, /אם\s*יהיה\s*שיפור|בהתאם\s*לשיפור|תלוי\s*ב/)) {
    out.discharge.blockers.push("שיפור קליני");
  }
}

/* ------------------------------------------------------------- uncertainty */

/** A lab or vital named next to something that isn't a parseable number. This
 *  is where guessing is genuinely dangerous, so it is flagged instead. */
/** Trailing guard only, and deliberately so: Hebrew prefixes attach to the noun
 *  ("הקריאטינין" is still creatinine), but a Hebrew suffix makes a different
 *  word entirely — "סוכר" is sugar, "סוכרת" is diabetes. */
const NAMED_VALUE_RE = new RegExp(
  `(קריאטינין|נתרן|אשלגן|המוגלובין|סוכר|לחץ\\s*דם|חום|דופק|סטורציה)${HA}\\s*(?:הוא|היה|של)?\\s*([^\\s]{0,12})`,
);

function extractUncertain(clause, out) {
  const namedValue = clause.match(NAMED_VALUE_RE);
  if (!namedValue) return;
  const value = namedValue[2] ?? "";
  if (/\d/.test(value)) return; // a number was found — nothing uncertain here
  if (!value || /^(תקין|תקינה|בסדר|יציב|טוב|נמוך|גבוה|ירד|עלה)/.test(value)) return;

  out.needsReview.push({ text: clause, reason: `ערך ${namedValue[1]} לא ברור בתמלול` });
}

/* -------------------------------------------------------------------- main */

function extractByRules(transcript) {
  const out = emptyExtraction();
  const text = normalise(transcript || "");
  if (!text) return out;

  extractVitals(text, out);

  for (const clause of clauses(text)) {
    extractHistory(clause.text, out);
    extractSocial(clause.text, out);
    extractSymptoms(clause.text, out);
    extractTestsAndPlan(clause, out);
    extractDiagnosis(clause.text, out);
    extractTreatment(clause.text, out);
    extractConsults(clause, out);
    extractDischarge(clause.text, out);
    extractUncertain(clause.text, out);
  }

  const uniq = (arr) => Array.from(new Set(arr.map((s) => s.trim())));
  out.chiefComplaint = uniq(out.chiefComplaint);
  out.pastMedicalHistory = uniq(out.pastMedicalHistory);
  out.socialStatus = uniq(out.socialStatus);
  out.workingDiagnosis = uniq(out.workingDiagnosis);
  out.treatmentPlan = uniq(out.treatmentPlan);
  out.other = uniq(out.other);
  out.tests.physicalExam = uniq(out.tests.physicalExam);
  out.tests.labs = uniq(out.tests.labs);
  out.tests.imaging = uniq(out.tests.imaging);
  out.tests.otherTests = uniq(out.tests.otherTests);
  out.discharge.blockers = uniq(out.discharge.blockers);

  const seenTasks = new Set();
  out.tasks = out.tasks.filter((t) => {
    const key = t.title.trim().toLowerCase();
    if (seenTasks.has(key)) return false;
    seenTasks.add(key);
    return true;
  });

  const seenConsults = new Set();
  out.consultations = out.consultations.filter((c) => {
    if (seenConsults.has(c.specialty)) return false;
    seenConsults.add(c.specialty);
    return true;
  });

  return out;
}

/* ===========================================================================
   Ward store — ported from lib/store/ward-store.tsx.

   Two rules make the merge safe to run repeatedly while the doctor is still
   talking:
     1. Nothing is ever removed. The AI only adds.
     2. Text already present in a section is not added again.

   And one gate: nothing the AI produced is part of the record until
   ״אישור סבב״ promotes the draft.
   =========================================================================== */

const ward = buildDemoWard();

const norm = (s) => s.trim().replace(/\s+/g, " ").toLowerCase();

function readList(data, path) {
  if (path.startsWith("tests.")) return data.tests[path.slice(6)];
  return data[path];
}

function writeList(data, path, items) {
  if (path.startsWith("tests.")) data.tests[path.slice(6)] = items;
  else data[path] = items;
}

function mergeInto(existing, incoming, stamp) {
  const seen = new Set(existing.map((i) => norm(i.text)));
  const fresh = [];
  for (const text of incoming) {
    const key = norm(text);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    fresh.push({ id: nid("c"), text: text.trim(), source: "ai", addedAt: stamp });
  }
  return { items: fresh.length ? existing.concat(fresh) : existing, added: fresh.length };
}

const LIST_PATHS = [
  ["chiefComplaint", "chiefComplaint"],
  ["pastMedicalHistory", "pastMedicalHistory"],
  ["socialStatus", "socialStatus"],
  ["tests.physicalExam", null],
  ["tests.labs", null],
  ["tests.imaging", null],
  ["tests.otherTests", null],
  ["workingDiagnosis", "workingDiagnosis"],
  ["treatmentPlan", "treatmentPlan"],
  ["other", "other"],
];

function incomingFor(extraction, path) {
  if (path.startsWith("tests.")) return extraction.tests[path.slice(6)];
  return extraction[path];
}

/** The whole merge, mutating the patient's draft in place. Returns the section
 *  paths that gained content so the UI can flash them. */
function applyExtractionTo(patient, extraction) {
  const stamp = Date.now();
  const touched = [];
  const data = patient.draftClinicalData;

  for (const [path] of LIST_PATHS) {
    const { items, added } = mergeInto(readList(data, path), incomingFor(extraction, path), stamp);
    if (added > 0) {
      writeList(data, path, items);
      touched.push(path);
    }
  }

  // Vitals overwrite rather than accumulate: the latest spoken value for a
  // vital IS the current value, and a stack of temperatures helps nobody.
  for (const key of VITAL_ORDER) {
    const value = extraction.vitals[key];
    if (!value) continue;
    if (data.vitals[key] && data.vitals[key].value === value) continue;
    data.vitals[key] = { value, source: "ai", addedAt: stamp };
    if (!touched.includes("vitals")) touched.push("vitals");
  }

  // Uncertain content — surfaced, never guessed at and never dropped.
  const reviewSeen = new Set(data.needsReview.map((r) => norm(r.text)));
  for (const r of extraction.needsReview) {
    if (reviewSeen.has(norm(r.text))) continue;
    reviewSeen.add(norm(r.text));
    data.needsReview.push({ id: nid("r"), text: r.text, reason: r.reason });
    if (!touched.includes("needsReview")) touched.push("needsReview");
  }

  // Tasks. Priority comes from derivePriority() — code, not the model.
  const taskSeen = new Set(patient.draftTasks.map((t) => norm(t.title)));
  for (const t of extraction.tasks) {
    if (taskSeen.has(norm(t.title))) continue;
    taskSeen.add(norm(t.title));
    patient.draftTasks.push({
      id: nid("t"),
      patientId: patient.id,
      title: t.title,
      category: t.category,
      priority: derivePriority(t.timing),
      status: "pending",
      timing: t.timing,
      createdFrom: "round",
      addedAt: stamp,
    });
    if (!touched.includes("tasks")) touched.push("tasks");
  }

  const consultSeen = new Set(patient.draftConsultations.map((c) => norm(c.specialty)));
  for (const c of extraction.consultations) {
    if (consultSeen.has(norm(c.specialty))) continue;
    consultSeen.add(norm(c.specialty));
    patient.draftConsultations.push({
      id: nid("k"),
      patientId: patient.id,
      specialty: c.specialty,
      state: "required",
      reason: c.reason,
      createdFrom: "round",
    });
    if (!touched.includes("consultations")) touched.push("consultations");
  }

  const discharge = patient.draftDischarge;
  if (extraction.discharge.status !== "unknown" && discharge.status !== extraction.discharge.status) {
    discharge.status = extraction.discharge.status;
    touched.push("discharge");
  }
  const blockerSeen = new Set(discharge.blockers.map((b) => norm(b.text)));
  for (const text of extraction.discharge.blockers) {
    if (blockerSeen.has(norm(text))) continue;
    blockerSeen.add(norm(text));
    discharge.blockers.push({ id: nid("b"), text, resolved: false });
    if (!touched.includes("discharge")) touched.push("discharge");
  }

  return touched;
}

/* ---------------------------------------------------------------- lifecycle */

function getPatient(id) {
  return ward.patients[id];
}
function getRoom(id) {
  return ward.rooms.find((r) => r.id === id);
}
function roomPatients(roomId) {
  const room = getRoom(roomId);
  if (!room) return [];
  return room.patientIds.map((id) => ward.patients[id]).filter(Boolean);
}

function openTaskCount(patient) {
  const tasks = patient.draftClinicalData ? patient.draftTasks : patient.tasks;
  return tasks.filter((t) => t.status !== "done").length;
}

function summariseRoom(room) {
  const list = room.patientIds.map((id) => ward.patients[id]).filter(Boolean);
  let openTasks = 0;
  let urgentTasks = 0;
  let possibleDischarges = 0;
  for (const p of list) {
    const tasks = p.draftClinicalData ? p.draftTasks : p.tasks;
    for (const t of tasks) {
      if (t.status === "done") continue;
      openTasks += 1;
      if (t.priority === "urgent") urgentTasks += 1;
    }
    const d = (p.draftClinicalData ? p.draftDischarge : p.discharge) ?? p.discharge;
    if (d.status === "today" || d.status === "tomorrow") possibleDischarges += 1;
  }
  return { patients: list.length, openTasks, urgentTasks, possibleDischarges };
}

/** Opens a draft. From here until approve or discard, every change lands in the
 *  draft copy and the record itself is untouched. */
function startRound(patientId) {
  const p = getPatient(patientId);
  if (!p) return;
  if (p.draftClinicalData) return;
  p.draftClinicalData = cloneClinicalData(p.approvedClinicalData);
  p.draftTasks = p.tasks.map((t) => ({ ...t }));
  p.draftConsultations = p.consultations.map((c) => ({ ...c }));
  p.draftDischarge = {
    status: p.discharge.status,
    blockers: p.discharge.blockers.map((b) => ({ ...b })),
  };
}

function discardRound(patientId) {
  const p = getPatient(patientId);
  if (!p) return;
  p.draftClinicalData = null;
  p.draftTasks = [];
  p.draftConsultations = [];
  p.draftDischarge = null;
  p.lastTranscript = null;
}

/** The review gate. Everything the AI produced has been sitting in the draft
 *  marked as such; this is the only path by which it becomes the record. */
function approveRound(patientId) {
  const p = getPatient(patientId);
  if (!p || !p.draftClinicalData || !p.draftDischarge) return;

  const promote = (items) => items.map((i) => ({ id: i.id, text: i.text, source: "approved" }));
  const d = p.draftClinicalData;

  const vitals = {};
  for (const key of VITAL_ORDER) {
    vitals[key] = d.vitals[key] ? { value: d.vitals[key].value, source: "approved" } : null;
  }

  p.approvedClinicalData = {
    chiefComplaint: promote(d.chiefComplaint),
    pastMedicalHistory: promote(d.pastMedicalHistory),
    socialStatus: promote(d.socialStatus),
    vitals,
    tests: {
      physicalExam: promote(d.tests.physicalExam),
      labs: promote(d.tests.labs),
      imaging: promote(d.tests.imaging),
      otherTests: promote(d.tests.otherTests),
    },
    workingDiagnosis: promote(d.workingDiagnosis),
    treatmentPlan: promote(d.treatmentPlan),
    other: promote(d.other),
    // Unresolved uncertainty survives approval. It is a standing flag, not
    // something the approve button is allowed to sweep away.
    needsReview: d.needsReview.map((r) => ({ ...r })),
  };

  p.tasks = p.draftTasks.map((t) => ({ ...t }));
  p.consultations = p.draftConsultations.map((c) => ({ ...c }));
  p.discharge = {
    status: p.draftDischarge.status,
    blockers: p.draftDischarge.blockers.map((b) => ({ ...b })),
  };

  const openUrgent = p.tasks.some((t) => t.priority === "urgent" && t.status !== "done");
  if (p.discharge.status === "today" || p.discharge.status === "tomorrow") {
    p.status = p.discharge.blockers.some((b) => !b.resolved) ? "monitoring" : "discharge-possible";
  }
  if (openUrgent) p.status = "attention";

  p.draftClinicalData = null;
  p.draftTasks = [];
  p.draftConsultations = [];
  p.draftDischarge = null;
  p.lastRoundAt = Date.now();
}

/* ----------------------------------------------------------- per-item edits */

function activeData(p) {
  return p.draftClinicalData ?? p.approvedClinicalData;
}
function activeTasks(p) {
  return p.draftClinicalData ? p.draftTasks : p.tasks;
}
function activeConsults(p) {
  return p.draftClinicalData ? p.draftConsultations : p.consultations;
}
function activeDischarge(p) {
  return (p.draftClinicalData ? p.draftDischarge : p.discharge) ?? p.discharge;
}

function editItem(p, path, id, text) {
  const list = readList(activeData(p), path);
  const found = list.find((i) => i.id === id);
  if (found) found.text = text.trim();
}
function deleteItem(p, path, id) {
  const data = activeData(p);
  writeList(data, path, readList(data, path).filter((i) => i.id !== id));
}
function addItem(p, path, text) {
  const t = text.trim();
  if (!t) return;
  readList(activeData(p), path).push({ id: nid("c"), text: t, source: "manual", addedAt: Date.now() });
}
function setVital(p, key, text) {
  const t = text.trim();
  activeData(p).vitals[key] = t ? { value: t, source: "manual", addedAt: Date.now() } : null;
}
function dismissReview(p, id) {
  const data = activeData(p);
  data.needsReview = data.needsReview.filter((r) => r.id !== id);
}
function moveReviewToOther(p, id) {
  const data = activeData(p);
  const entry = data.needsReview.find((r) => r.id === id);
  if (!entry) return;
  data.other.push({ id: nid("c"), text: entry.text, source: "manual", addedAt: Date.now() });
  data.needsReview = data.needsReview.filter((r) => r.id !== id);
}

/* ===========================================================================
   עוזר המחלקה — questions answered from the ward's own data.

   This is a retrieval engine, not a language model. It searches the records
   that are actually loaded, counts what it finds, and answers with the patients
   it matched — name, room, bed and the line that matched — so every answer can
   be checked against the record it came from.

   That shape is deliberate. A ward assistant that paraphrases confidently and
   cites nothing is worse than no assistant at all: the one question a doctor
   asks it ("who is on morphine?") is exactly the question where a plausible
   wrong answer does harm. So it never writes a clinical sentence of its own —
   it quotes, counts, and links.

   In the application this same engine is the fallback, and the primary path
   sends the ward summary to Claude server-side. It matters that the fallback
   is the honest-by-construction one: when the model is unavailable, the
   assistant degrades to quoting the record rather than to guessing.
   =========================================================================== */

/** Words that carry no search signal in a Hebrew ward question. */
const STOPWORDS = new Set([
  "כמה", "מי", "מיהם", "מיהן", "אילו", "איזה", "איזו", "אלו", "מה", "האם", "יש",
  "לי", "לנו", "שלי", "את", "של", "עם", "או", "גם", "כל", "כלל", "הם", "הן",
  "הוא", "היא", "זה", "זאת", "לפי", "על", "אל", "כדי", "עכשיו", "כרגע", "היום",
  "מטופל", "מטופלת", "מטופלים", "מטופלות", "חולה", "חולים", "אנשים", "אדם",
  "במחלקה", "מחלקה", "בחדר", "חדר", "מיטה", "תראה", "תן", "הצג", "רשימה",
  "שלוקחים", "לוקחים", "לוקח", "לוקחת", "מקבלים", "מקבל", "מקבלת", "נמצאים",
  "נמצא", "יושבים", "שיש", "שהם", "שהן", "אשר", "עבור", "בבקשה", "תגיד",
  "כמות", "מספר", "סהכ", "בסך", "הכל", "צריך", "צריכים", "ליום", "כרגיל",
]);

/** Fixed questions the ward asks every morning, recognised before free search
 *  so they answer with the right shape rather than a keyword list. */
const INTENTS = [
  {
    id: "urgent",
    test: /דחוף|דחופ|בדחיפות|urgent/i,
    /** Vocabulary the intent already accounts for. A word outside both this and
     *  `test` means the question is about something else — "אילו מטופלים
     *  דחופים מקבלים מורפיום" is a morphine question, not a priority one. */
    absorbs: /^(משימ|פעול|פתוח|סגור|עכשיו|מיידי|נשאר)/,
    run: () => {
      const rows = allTasks().filter((r) => r.task.priority === "urgent" && r.task.status !== "done");
      return {
        headline:
          rows.length === 0
            ? "אין משימות דחופות פתוחות במחלקה."
            : `${rows.length} משימות דחופות פתוחות, אצל ${new Set(rows.map((r) => r.patient.id)).size} מטופלים.`,
        rows: rows.map((r) => ({ patient: r.patient, quote: r.task.title, where: "משימה דחופה" })),
      };
    },
  },
  {
    id: "discharge",
    test: /שחרור|לשחרר|משחרר|הביתה/,
    absorbs: /^(מתוכננ|צפוי|אפשר|מוכנ|היום|מחר|קרוב|רשימ)/,
    run: () => {
      const list = patientsList().filter((p) => {
        const d = activeDischarge(p);
        return d.status === "today" || d.status === "tomorrow";
      });
      return {
        headline:
          list.length === 0
            ? "אין שחרורים מתוכננים להיום או למחר."
            : `${list.length} מטופלים מסומנים לשחרור אפשרי היום או מחר.`,
        rows: list.map((p) => {
          const d = activeDischarge(p);
          const open = d.blockers.filter((b) => !b.resolved);
          return {
            patient: p,
            quote: `${DISCHARGE_STATUS[d.status].label} · ${open.length === 0 ? "אין חסמים" : `${open.length} חסמים פתוחים`}`,
            where: "שחרור",
          };
        }),
      };
    },
  },
  {
    id: "blockers",
    test: /חסם|חסמים|מעכב|תקוע/,
    absorbs: /^(פתוח|שחרור|נשאר|רשימ|לשחרור)/,
    run: () => {
      const rows = [];
      for (const p of patientsList()) {
        for (const b of activeDischarge(p).blockers) {
          if (!b.resolved) rows.push({ patient: p, quote: b.text, where: "חסם לשחרור" });
        }
      }
      return {
        headline:
          rows.length === 0
            ? "אין חסמי שחרור פתוחים במחלקה."
            : `${rows.length} חסמי שחרור פתוחים אצל ${new Set(rows.map((r) => r.patient.id)).size} מטופלים.`,
        rows,
      };
    },
  },
  {
    id: "consults",
    test: /ייעוץ|יעוץ|ייעוצים|יועץ|התייעצות/,
    absorbs: /^(ממתינ|פתוח|נדרש|הוזמנ|רשימ|הושלמ)/,
    run: () => {
      const rows = [];
      for (const p of patientsList()) {
        for (const c of activeConsults(p)) {
          if (c.state !== "completed") {
            rows.push({ patient: p, quote: `${c.specialty} — ${CONSULT_STATE[c.state].label}`, where: "ייעוץ" });
          }
        }
      }
      return {
        headline:
          rows.length === 0 ? "אין ייעוצים פתוחים." : `${rows.length} ייעוצים שטרם הושלמו.`,
        rows,
      };
    },
  },
  {
    id: "attention",
    test: /תשומת\s*לב|מצב\s*קשה|לא\s*יציב|מדאיג|החמרה/,
    absorbs: /^(תשומת|דורש|מצב|קשה|יציב|רשימ)/,
    run: () => {
      const list = patientsList().filter((p) => p.status === "attention");
      return {
        headline:
          list.length === 0
            ? "אין מטופלים המסומנים כדורשים תשומת לב."
            : `${list.length} מטופלים מסומנים כדורשים תשומת לב.`,
        rows: list.map((p) => ({ patient: p, quote: p.primaryDiagnosis, where: "אבחנה עיקרית" })),
      };
    },
  },
  {
    id: "beds",
    test: /פנוי|פנויים|מקום|תפוסה|מיטות/,
    absorbs: /^(חדר|חדרים|מיט|תפוס|מקום|אשפוז)/,
    run: () => {
      const empty = ward.rooms.filter((r) => r.status === "empty");
      const unavailable = ward.rooms.filter((r) => r.status === "unavailable");
      const total = patientsList().length;
      return {
        headline: `${total} מטופלים מאושפזים. ${empty.length} חדרים פנויים${
          unavailable.length ? `, ${unavailable.length} חדרים אינם פעילים` : ""
        }.`,
        rows: [],
        note: empty.length
          ? `חדרים פנויים: ${empty.map((r) => r.number).join(", ")}.`
          : null,
      };
    },
  },
];

function patientsList() {
  return Object.values(ward.patients);
}

function allTasks() {
  const rows = [];
  for (const p of patientsList()) {
    for (const task of activeTasks(p)) rows.push({ task, patient: p });
  }
  return rows;
}

/** Every line of a patient's record, tagged with the section it came from, so a
 *  match can say where it was found instead of just that it was. */
function searchableLines(p) {
  const d = activeData(p);
  const out = [
    { where: "אבחנה עיקרית", text: p.primaryDiagnosis },
    { where: "קופה", text: p.hmo },
  ];
  const push = (where, items) => items.forEach((i) => out.push({ where, text: i.text }));
  push("תלונה עיקרית", d.chiefComplaint);
  push("מחלות רקע", d.pastMedicalHistory);
  push("סטטוס סוציאלי", d.socialStatus);
  push("בדיקה גופנית", d.tests.physicalExam);
  push("מעבדה", d.tests.labs);
  push("הדמיה", d.tests.imaging);
  push("בדיקות נוספות", d.tests.otherTests);
  push("אבחנת עבודה", d.workingDiagnosis);
  push("תכנית טיפול", d.treatmentPlan);
  push("אחר / הערות", d.other);
  for (const t of activeTasks(p)) out.push({ where: "משימה", text: t.title });
  for (const c of activeConsults(p)) out.push({ where: "ייעוץ", text: c.specialty });
  for (const b of activeDischarge(p).blockers) out.push({ where: "חסם לשחרור", text: b.text });
  for (const key of VITAL_ORDER) {
    const v = d.vitals[key];
    if (v) out.push({ where: VITAL_LABELS[key].label, text: `${VITAL_LABELS[key].label} ${v.value}` });
  }
  return out;
}

/**
 * Hebrew prefixes attach to the noun, and they can be on either side of the
 * comparison: the question says "מסוכרת" while the record says "סוכרת", or the
 * question says "סוכרת" while the record says "בסוכרת". So a term is matched
 * against its own stripped form as well, in both directions.
 *
 * Only the leading side is ever loosened. A trailing letter makes a different
 * word — סוכר is sugar, סוכרת is diabetes — and matching across that would be
 * the same bug the extractor already had.
 */
const HE_PREFIX = /^[בהולכמש]{1,2}(?=[֐-׿]{3,})/;

function termVariants(term) {
  const base = term.toLowerCase();
  const stripped = base.replace(HE_PREFIX, "");
  return stripped !== base ? [base, stripped] : [base];
}

function termMatches(line, term) {
  const haystack = line.toLowerCase();
  for (const v of termVariants(term)) {
    if (haystack.includes(v)) return true;
    if (new RegExp(`(?:^|[^\\u0590-\\u05FFa-z0-9])[בהולכמש]{1,2}${escapeRe(v)}`, "i").test(haystack)) return true;
  }
  return false;
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function terms(question) {
  return question
    .replace(/[?!.,;:״"׳']/g, " ")
    .split(/\s+/)
    .map((w) => w.trim())
    .filter((w) => w.length >= 3 && !STOPWORDS.has(w));
}

/**
 * Answers a question about the ward.
 * Returns { headline, rows, note, terms } — never prose the engine invented.
 */
function askWard(question) {
  const q = (question || "").trim();
  if (!q) return null;

  const words = terms(q);

  // A fixed intent wins only when every content word in the question belongs to
  // it. One word it cannot account for means the question is about something
  // else, and free search will do better.
  for (const intent of INTENTS) {
    if (!intent.test.test(q)) continue;
    const unaccounted = words.filter(
      (w) => !intent.test.test(w) && !(intent.absorbs && intent.absorbs.test(w)),
    );
    if (unaccounted.length === 0) return { ...intent.run(), terms: [], intent: intent.id };
  }

  if (words.length === 0) {
    return {
      headline: "לא זיהיתי מונח לחיפוש בשאלה.",
      rows: [],
      note: "אפשר לשאול למשל: כמה מטופלים מקבלים מורפיום · מי דחוף · אילו שחרורים מתוכננים · חסמים פתוחים.",
      terms: [],
    };
  }

  const matches = [];
  for (const p of patientsList()) {
    const hits = [];
    const covered = new Set();
    for (const line of searchableLines(p)) {
      const on = words.filter((w) => termMatches(line.text, w));
      if (on.length) {
        hits.push(line);
        on.forEach((w) => covered.add(w));
      }
    }
    if (hits.length) matches.push({ patient: p, hits, covered });
  }

  // Best-match, not any-match: a two-word question is answered by the patients
  // who satisfy the most of it. Falling back to OR would quietly widen "מי
  // סובל מסוכרת" into everyone whose record contains either word.
  const best = matches.reduce((m, r) => Math.max(m, r.covered.size), 0);
  const kept = matches.filter((m) => m.covered.size === best);
  kept.sort((a, b) => b.hits.length - a.hits.length || a.patient.name.localeCompare(b.patient.name, "he"));

  const matched = words.filter((w) => kept.some((m) => m.covered.has(w)));
  const label = (matched.length ? matched : words).join(" ");
  const dropped = words.filter((w) => !matched.includes(w));

  return {
    headline:
      kept.length === 0
        ? `לא נמצאו מטופלים שבמידע שלהם מופיע ״${words.join(" ")}״.`
        : `${kept.length} ${kept.length === 1 ? "מטופל" : "מטופלים"} עם ״${label}״ ברשומה.`,
    rows: kept.map((m) => ({ patient: m.patient, quote: m.hits[0].text, where: m.hits[0].where })),
    note:
      kept.length === 0
        ? "החיפוש עובר על כל שמונה הקטגוריות, המשימות, הייעוצים והחסמים. ייתכן שהמונח מנוסח אחרת ברשומה."
        : dropped.length
          ? `לא נמצאה התאמה ל־״${dropped.join(" ")}״ — התשובה מבוססת על שאר המונחים בשאלה.`
          : null,
    terms: matched.length ? matched : words,
  };
}

const ASSISTANT_SUGGESTIONS = [
  "כמה מטופלים מקבלים מורפיום",
  "מי מקבל צפטריאקסון",
  "אילו משימות דחופות פתוחות",
  "אילו שחרורים מתוכננים",
  "מי סובל מסוכרת",
];

/* ===========================================================================
   Rendering helpers, icon set and shared fragments.

   The preview renders with template strings and a delegated click handler
   rather than a framework — one file, no build step, no network. The markup and
   class names mirror the React components one-for-one so a change in either
   place is easy to carry across.
   =========================================================================== */

const esc = (s) =>
  String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

const cx = (...parts) => parts.filter(Boolean).join(" ");

/* ------------------------------------------------------------------- icons */
/* 24-grid, 1.5 stroke, decorative: every icon is paired with a visible label. */

/** `attrs` is raw markup, not a class name — every call site passes a sizing
 *  style (and occasionally a class), and an SVG left unsized expands to fill
 *  whatever box it lands in. */
const svg = (body, attrs) =>

/** IntersectionObserver stagger — mirrors components/motion/Reveal.tsx.
 *  Disconnects after firing so nothing re-animates on scroll-back. */
function armReveals(root) {
  const nodes = root.querySelectorAll(".reveal:not(.shown)");
  if (!nodes.length) return;
  if (calm()) {
    nodes.forEach((n) => n.classList.add("shown"));
    return;
  }
  const io = new IntersectionObserver(
    (entries, obs) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        e.target.classList.add("shown");
        obs.unobserve(e.target);
      }
    },
    { rootMargin: "0px 0px -8% 0px", threshold: 0.05 },
  );
  nodes.forEach((n) => io.observe(n));
}

/** A value the AI placed in the last few seconds still carries its wash. */
function isFresh(addedAt) {
  return typeof addedAt === "number" && Date.now() - addedAt < 2600;
}

/* ===========================================================================
   The scroll-scrubbed corridor — drawn, not filmed.
   Ported from components/motion/CorridorScroll.tsx.

   This stands in for the supplied scroll clip and keeps the exact mechanics the
   real sequence will use, so swapping footage in later is a component swap and
   nothing more:

     · canvas backing store at display size × DPR, so it is sharp rather than a
       small buffer stretched across the viewport
     · no scroll listeners — an IntersectionObserver runs a rAF loop only while
       the section is near the viewport
     · position read from getBoundingClientRect inside the frame, so scrolling
       up reverses the walk for free
     · a lerp smooths fast flicks, with a snap so it settles
     · reduced motion collapses the runway and draws one still
   =========================================================================== */

const HALF_W = 1.45; // corridor half-width
const FLOOR_Y = 1.15;
const CEIL_Y = -1.55;
const DOOR_TOP = -0.72;
const Z_END = 27; // far wall
const DOOR_SLOTS = [3.6, 6.8, 10, 13.2, 16.4, 19.6, 22.8];
const DOOR_DEPTH = 1.15;
/** The walk stops just short of the far door, framing it the way the
 *  room-selection screen opens. */
const WALK = 25.1;

/** The walk is finished at this point; the door ahead opens on its own. Short of
 *  1 so it fires while the reader is still moving, not after they hit the stop. */
const ARRIVE_AT = 0.975;

function mountCorridor(section, onArrive) {
  const canvas = section.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  if (!ctx) return () => {};

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shown = 0;
  let running = false;
  let raf = 0;
  let arrived = false;
  /** Where the far door sits on screen in CSS pixels, so the DOM door that
   *  opens at the end can be placed exactly over the drawn one. */
  let doorRect = null;

  function draw(t) {
    const W = canvas.width;
    const H = canvas.height;
    if (!W || !H) return;

    const camZ = t * WALK;
    const cx = W / 2;
    // Eye line slightly above centre — a corridor viewed from standing height.
    const cy = H * 0.47;
    const f = H * 0.62;

    const px = (x, z) => cx + (x * f) / z;
    const py = (y, z) => cy + (y * f) / z;

    const quad = (pts, fill) => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    };

    // Ground: the warm haze at the vanishing point reads as light spilling from
    // the room at the end, which is where the walk is heading.
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, H * 0.9);
    bg.addColorStop(0, "#FFFCF5");
    bg.addColorStop(0.45, "#F6EFE4");
    bg.addColorStop(1, "#EDE4D6");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ---- far wall + the door the walk ends on ----
    const zEnd = Math.max(0.6, Z_END - camZ);
    const eL = px(-HALF_W, zEnd);
    const eR = px(HALF_W, zEnd);
    const eT = py(CEIL_Y, zEnd);
    const eB = py(FLOOR_Y, zEnd);
    quad([[eL, eT], [eR, eT], [eR, eB], [eL, eB]], "#F3ECE0");

    const dW = 0.5;
    const dL = px(-dW, zEnd);
    const dR = px(dW, zEnd);
    const dT = py(DOOR_TOP, zEnd);
    quad(
      [
        [px(-dW - 0.09, zEnd), py(DOOR_TOP - 0.09, zEnd)],
        [px(dW + 0.09, zEnd), py(DOOR_TOP - 0.09, zEnd)],
        [px(dW + 0.09, zEnd), eB],
        [px(-dW - 0.09, zEnd), eB],
      ],
      "#E4DACA",
    );
    const slab = ctx.createLinearGradient(dL, dT, dR, eB);
    slab.addColorStop(0, "#D6B98F");
    slab.addColorStop(0.55, "#C9A87C");
    slab.addColorStop(1, "#B99669");
    quad([[dL, dT], [dR, dT], [dR, eB], [dL, eB]], slab);

    // Recorded in CSS pixels for the hand-off to the DOM door.
    const scale = canvas.clientWidth / W;
    doorRect = {
      left: dL * scale,
      top: dT * scale,
      width: (dR - dL) * scale,
      height: (eB - dT) * scale,
    };

    // handle, only once it is large enough to read
    const handleW = (dR - dL) * 0.13;
    if (handleW > 2) {
      ctx.fillStyle = "#3A3A38";
      const hy = dT + (eB - dT) * 0.52;
      ctx.fillRect(dR - handleW * 2.1, hy, handleW, Math.max(1, handleW * 0.3));
    }

    // ---- side walls, drawn far to near so nearer surfaces overdraw ----
    for (let i = DOOR_SLOTS.length - 1; i >= 0; i -= 1) {
      const za = DOOR_SLOTS[i] - camZ;
      const zb = za + DOOR_DEPTH;
      if (zb <= 0.6) continue; // fully behind the camera
      const zn = Math.max(0.6, za);
      const zf = Math.max(0.7, zb);

      const depth = 1 - Math.min(1, zn / Z_END);
      const wall = `rgba(250,246,238,${0.55 + depth * 0.45})`;

      for (const side of [-1, 1]) {
        const x = HALF_W * side;
        const nT = py(CEIL_Y, zn);
        const nB = py(FLOOR_Y, zn);
        const fT = py(CEIL_Y, zf);
        const fB = py(FLOOR_Y, zf);
        const nX = px(x, zn);
        const fX = px(x, zf);

        quad([[nX, nT], [fX, fT], [fX, fB], [nX, nB]], wall);

        // doorway: recessed frame, then the slab
        const dnT = py(DOOR_TOP, zn);
        const dfT = py(DOOR_TOP, zf);
        quad([[nX, dnT], [fX, dfT], [fX, fB], [nX, nB]], "#E6DCCC");

        const inset = 0.1;
        const inN = Math.max(0.6, zn + inset);
        const inF = Math.max(0.7, zf - inset);
        const g = ctx.createLinearGradient(px(x, inN), 0, px(x, inF), 0);
        const lit = side < 0 ? 1 : 0.92;
        g.addColorStop(0, `rgba(214,185,143,${lit})`);
        g.addColorStop(1, `rgba(185,150,105,${lit})`);
        quad(
          [
            [px(x, inN), py(DOOR_TOP + 0.05, inN)],
            [px(x, inF), py(DOOR_TOP + 0.05, inF)],
            [px(x, inF), py(FLOOR_Y, inF)],
            [px(x, inN), py(FLOOR_Y, inN)],
          ],
          g,
        );

        // ceiling downlight above the doorway
        const lx = px(x * 0.72, (zn + zf) / 2);
        const ly = py(CEIL_Y + 0.04, (zn + zf) / 2);
        const r = Math.max(2, (f / ((zn + zf) / 2)) * 0.11);
        const glow = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 3);
        glow.addColorStop(0, "rgba(255,246,222,.95)");
        glow.addColorStop(1, "rgba(255,246,222,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(lx, ly, r * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---- floor and ceiling, as one long quad each ----
    const zNear = 0.75;
    const zFar = Math.max(1, Z_END - camZ);
    const floorGrad = ctx.createLinearGradient(0, py(FLOOR_Y, zFar), 0, H);
    floorGrad.addColorStop(0, "#EFE7DA");
    floorGrad.addColorStop(1, "#E4D9C7");
    quad(
      [
        [px(-HALF_W, zFar), py(FLOOR_Y, zFar)],
        [px(HALF_W, zFar), py(FLOOR_Y, zFar)],
        [px(HALF_W, zNear), py(FLOOR_Y, zNear)],
        [px(-HALF_W, zNear), py(FLOOR_Y, zNear)],
      ],
      floorGrad,
    );
    quad(
      [
        [px(-HALF_W, zFar), py(CEIL_Y, zFar)],
        [px(HALF_W, zFar), py(CEIL_Y, zFar)],
        [px(HALF_W, zNear), py(CEIL_Y, zNear)],
        [px(-HALF_W, zNear), py(CEIL_Y, zNear)],
      ],
      "#FCF9F3",
    );

    // Vignette, so the corridor sits inside the page rather than on it.
    const vig = ctx.createRadialGradient(cx, cy, H * 0.3, cx, cy, H * 0.95);
    vig.addColorStop(0, "rgba(247,241,232,0)");
    vig.addColorStop(1, "rgba(238,229,215,.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth * dpr);
    const h = Math.round(canvas.clientHeight * dpr);
    if (w === canvas.width && h === canvas.height) return;
    canvas.width = w;
    canvas.height = h;
    draw(shown);
  }

  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  resize();

  if (reduce) {
    shown = 0.72;
    draw(shown);
    return () => ro.disconnect();
  }

  function progress() {
    const rect = section.getBoundingClientRect();
    const runway = rect.height - window.innerHeight;
    if (runway <= 0) return 0;
    return Math.max(0, Math.min(1, -rect.top / runway));
  }

  function tick() {
    const target = progress();
    shown += (target - shown) * 0.12;
    if (Math.abs(target - shown) < 0.0015) shown = target;
    draw(shown);

    // Reaching the end of the corridor IS the transition. The reader walked up
    // to the door; the door opens. Pressing a button to do what the walk was
    // already doing would break the illusion the whole sequence buys.
    if (!arrived && target >= ARRIVE_AT && onArrive) {
      arrived = true;
      running = false;
      cancelAnimationFrame(raf);
      const rect = canvas.getBoundingClientRect();
      onArrive(
        doorRect && {
          left: rect.left + doorRect.left,
          top: rect.top + doorRect.top,
          width: doorRect.width,
          height: doorRect.height,
        },
      );
      return;
    }

    if (running) raf = requestAnimationFrame(tick);
  }

  const io = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting && !running) {
          running = true;
          raf = requestAnimationFrame(tick);
        } else if (!entry.isIntersecting && running) {
          running = false;
          cancelAnimationFrame(raf);
        }
      }
    },
    { rootMargin: "40% 0px 40% 0px" },
  );
  io.observe(section);

  return () => {
    io.disconnect();
    ro.disconnect();
    cancelAnimationFrame(raf);
    running = false;
  };
}

/* ===========================================================================
   Screens.

   0  opening      — branding hero, scroll-scrubbed corridor, handoff
   1  rooms        — fifteen doors, 5 / 5 / 5
   2  room         — three summary tiles, one large card per patient
   3  patient      — eight permanent clinical categories + operational column
   4  tasks        — the ward's open work, grouped by priority
   =========================================================================== */

const state = {
  screen: "open",
  roomId: null,
  patientId: null,
  /** Inline editing target, so a re-render never eats a half-typed correction. */
  editing: null,
  pickingPriority: null,
  enginePickerOpen: false,
  taskFilter: "all",
  /** Entrance animations play on arrival at a screen, not on every state
   *  change while the reader is already there — re-arming an observer would
   *  leave anything scrolled past stuck at opacity 0. */
  animate: true,
  settingsOpen: false,
  assistantOpen: false,
  /** Answered questions, newest last. Kept in memory only. */
  chat: [],
};

/* ------------------------------------------------------------ preferences */

const PREF_KEY = "carewell.prefs.v1";

const prefs = { theme: "light", calmMotion: false };

function loadPrefs() {
  try {
    Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || "{}"));
  } catch {
    // A sandboxed frame may refuse storage entirely; defaults are fine.
  }
  applyPrefs();
}

function applyPrefs() {
  document.documentElement.setAttribute("data-theme", prefs.theme);
  document.documentElement.toggleAttribute("data-calm", prefs.calmMotion);
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
  } catch {
    // Preference is still applied for this session.
  }
}

/** True when motion should be suppressed — either the OS asked, or the reader
 *  did through the settings menu. */
function calm() {
  return prefs.calmMotion || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

const app = document.getElementById("app");
let disposeCorridor = null;

function go(screen, arg) {
  if (disposeCorridor) {
    disposeCorridor();
    disposeCorridor = null;
  }
  state.editing = null;
  state.pickingPriority = null;
  state.enginePickerOpen = false;
  if (screen === "room") state.roomId = arg;
  if (screen === "patient") state.patientId = arg;
  state.screen = screen;
  state.animate = true;
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function render() {
  const html =
    state.screen === "open"
      ? viewOpen()
      : state.screen === "rooms"
        ? viewRooms()
        : state.screen === "room"
          ? viewRoom()
          : state.screen === "patient"
            ? viewPatient()
            : viewTasks();

  app.innerHTML = html + utilityBar() + settingsMenuHost() + assistantPanel();
  armReveals(app);
  state.animate = false;

  if (state.screen === "open") {
    const section = app.querySelector(".corridor");
    if (section) disposeCorridor = mountCorridor(section, arriveAtDoor);
  }
  if (state.screen === "patient") {
    mountRecorder();
    focusEditor();
  }
}

/* ----------------------------------------------------- utility + settings -*/

function utilityBar() {
  return `<div class="utility">
    <button class="u-btn" data-assistant="open" aria-label="עוזר המחלקה">

      ${I.gear(iconStyle(18))}
    </button>
    ${state.settingsOpen ? settingsMenu() : ""}

}

function settingsMenuHost() {
  return "";
}

function settingsMenu() {

        <span class="grow">איפוס נתוני ההדגמה<span class="hint">מחזיר את המחלקה למצב ההתחלתי</span></span>

      </button>
    </div>
  </div>`;
}

/* --------------------------------------------------------------- assistant */

function assistantPanel() {
  if (!state.assistantOpen) return "";

  const log = state.chat.length
    ? state.chat
        .map(
          (turn) => `
        <p class="ask">${esc(turn.question)}</p>
        <div class="answer">
          <p class="headline">${esc(turn.answer.headline)}</p>
          ${turn.answer.note ? `<p class="note">${esc(turn.answer.note)}</p>` : ""}
          ${
            turn.answer.rows.length
              ? `<div class="hits">${turn.answer.rows
                  .map(
                    (r) => `<button class="hit" data-patient="${r.patient.id}" data-close-assistant="1">
                      <span class="grow" style="min-width:0;flex:1">
                        <span class="who">${esc(r.patient.name)}</span>
                        <span class="where"> · חדר ${getRoom(r.patient.roomId).number}, מיטה ${r.patient.bed} · ${esc(r.where)}</span>
                        <span class="quote">${highlight(r.quote, turn.answer.terms)}</span>
                      </span>
                      ${I.chevron(iconStyle(16))}
                    </button>`,
                  )
                  .join("")}</div>`
              : ""
          }
        </div>`,
        )
        .join("")
    : `<div class="answer">
        <p class="headline">שאלו על המחלקה — התשובה נשלפת מהרשומות עצמן.</p>
        <p class="note">כל תשובה מגיעה עם המטופלים והשורות שממנה חושבה, כדי שאפשר יהיה לבדוק אותה מול הרשומה.</p>
      </div>
      <div class="suggestions">${ASSISTANT_SUGGESTIONS.map(
        (s) => `<button data-ask="${esc(s)}">${esc(s)}</button>`,
      ).join("")}</div>`;

  return `<div class="scrim" data-assistant="close"></div>
  <aside class="assistant" aria-label="עוזר המחלקה">
    <div class="head">
      <span class="mark">${I.assistant(iconStyle(18))}</span>
      <h2>עוזר המחלקה</h2>
      <button class="icon-btn" data-assistant="close" aria-label="סגירה">${I.close(iconStyle(18))}</button>
    </div>
    <div class="log" id="assistant-log">${log}</div>
    <div class="compose">
      <input type="text" id="assistant-input" placeholder="למשל: כמה מטופלים מקבלים מורפיום" autocomplete="off" />
      <button class="send" data-assistant="send" aria-label="שליחה">${I.send(iconStyle(20))}</button>
    </div>
    <p class="source">התשובות נשלפות מהרשומות הטעונות באפליקציה — שמונה הקטגוריות, המשימות, הייעוצים והחסמים — ומצוטטות כלשונן. בתצוגה המוטמעת אין מפתח API, ולכן זהו חיפוש מקומי ולא מודל שפה. כל הנתונים בדיוניים.</p>
  </aside>`;
}

/** Marks the searched terms inside a quoted line, so the reason a patient came
 *  back is visible rather than asserted. */
function highlight(text, terms) {
  let out = esc(text);
  for (const t of terms || []) {
    if (t.length < 3) continue;
    out = out.replace(new RegExp(`([\\u0590-\\u05FFa-zA-Z0-9]*${escapeRe(esc(t))}[\\u0590-\\u05FFa-zA-Z0-9]*)`, "gi"), "<mark>$1</mark>");
  }
  return out;
}

function submitQuestion(text) {
  const question = (text || "").trim();
  if (!question) return;
  const answer = askWard(question);
  state.chat.push({ question, answer });
  refreshAssistant();
}

function refreshAssistant() {
  const old = app.querySelector(".assistant");
  const scrim = app.querySelector(".scrim");
  if (old) old.remove();
  if (scrim) scrim.remove();
  app.insertAdjacentHTML("beforeend", assistantPanel());
  const log = document.getElementById("assistant-log");
  if (log) log.scrollTop = log.scrollHeight;
  const input = document.getElementById("assistant-input");
  if (input) input.focus();
}

function refreshUtility() {
  const bar = app.querySelector(".utility");
  if (bar) bar.outerHTML = utilityBar();
}

/**
 * The end of the walk.
 *
 * The reader has just spent three viewport-heights walking up to a closed door;
 * the door opens and they step through. `rect` is where the drawn door sits on
 * screen, so the DOM door that takes over is placed exactly on top of it and
 * the hand-off from canvas to CSS is invisible.
 */
function arriveAtDoor(rect) {
  if (state.screen !== "open") return;
  if (calm() || !rect || rect.width < 8) {
    go("rooms");
    return;
  }

  const layer = document.createElement("div");
  layer.className = "door-transition";
  layer.setAttribute("role", "presentation");
  layer.setAttribute("aria-hidden", "true");
  // No number on this one: it is the door at the end of the corridor, not a
  // room the reader has chosen yet.
  layer.innerHTML = `<div class="flyer" style="top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;height:${rect.height}px">${doorSlab(
    "",
    { style: "height:100%;aspect-ratio:auto" },
  )}</div><div class="flood"></div>`;
  app.appendChild(layer);

  const flyer = layer.querySelector(".flyer");
  const door = layer.querySelector(".door");
  const flood = layer.querySelector(".flood");

  const th = Math.min(window.innerHeight * 0.92, 860);
  const tw = th * 0.8;

  requestAnimationFrame(() => {
    flyer.style.top = `${(window.innerHeight - th) / 2}px`;
    flyer.style.left = `${(window.innerWidth - tw) / 2}px`;
    flyer.style.width = `${tw}px`;
    flyer.style.height = `${th}px`;
  });
  setTimeout(() => door.classList.add("open"), 380);
  setTimeout(() => {
    flyer.style.transitionDuration = "460ms";
    flyer.style.transform = "scale(2.9)";
    flood.style.opacity = "0.55";
  }, 700);
  setTimeout(() => {
    flyer.style.opacity = "0";
    flood.style.opacity = "1";
  }, 1020);
  setTimeout(() => {
    layer.remove();
    go("rooms");
  }, 1240);
}

/** The branding dissolves into the cream ground on the way to the ward, rather
 *  than the page simply swapping. */
function enterWard() {
  const reduced = calm();
  if (reduced) {
    go("rooms");
    return;
  }
  const wash = document.getElementById("wash");
  for (const id of ["hero-action", "handoff-inner"]) {
    const node = document.getElementById(id);
    if (node) {
      node.style.transition = "transform 560ms ease-out, opacity 560ms ease-out, filter 560ms ease-out";
      node.style.transform = "scale(.92)";
      node.style.opacity = "0";
      node.style.filter = "blur(2px)";
    }
  }
  if (wash) wash.classList.add("on");
  setTimeout(() => go("rooms"), 560);
}

/* -------------------------------------------------------------- screen 1 --*/

function viewRooms() {
  const totals = ward.rooms.reduce(
    (acc, room) => {
      const s = summariseRoom(room);
      acc.patients += s.patients;
      acc.openTasks += s.openTasks;
      acc.urgent += s.urgentTasks;
      acc.discharges += s.possibleDischarges;
      return acc;
    },
    { patients: 0, openTasks: 0, urgent: 0, discharges: 0 },
  );

  const doors = ward.rooms
    .map((room, i) => `<li class="reveal pop" style="--d:${i}">${doorTile(room)}</li>`)
    .join("");

  return `
  ${header({ rule: "בחירת חדר" })}
  <main id="main"><div class="ward">
    <div class="ward-bar">
      <dl>
        <div><dt>מטופלים במחלקה</dt><dd class="tnum">${totals.patients}</dd></div>
        <div><dt>משימות פתוחות</dt><dd class="tnum">${totals.openTasks}</dd></div>
        ${totals.urgent > 0 ? `<div><dt>דחופות</dt><dd class="tnum urgent"><span aria-hidden="true" style="font-size:11px">▲ </span>${totals.urgent}</dd></div>` : ""}
        <div><dt>שחרורים אפשריים</dt><dd class="tnum info">${totals.discharges}</dd></div>
      </dl>
      <button class="link" data-go="tasks">${I.clipboard(iconStyle(18))}כל המשימות</button>
    </div>

    <ul class="door-grid">${doors}</ul>
  </div></main>
  ${footer()}`;
}

function doorTile(room) {
  const s = summariseRoom(room);
  const unavailable = room.status === "unavailable";
  const empty = room.status === "empty";

  const description = unavailable
    ? `חדר ${room.number}, ${room.note || "אינו פעיל"}`
    : empty
      ? `חדר ${room.number}, פנוי`
      : [
          `חדר ${room.number}`,
          `${s.patients} מטופלים`,
          s.openTasks > 0 ? `${s.openTasks} משימות פתוחות` : null,
          s.urgentTasks > 0 ? `${s.urgentTasks} דחופות` : null,
          s.possibleDischarges > 0 ? `${s.possibleDischarges} שחרורים אפשריים` : null,
        ]
          .filter(Boolean)
          .join(", ");

  const chips = unavailable || empty
    ? ""
    : `<span class="chips">
        ${s.urgentTasks > 0 ? `<span class="mini urgent" title="${s.urgentTasks} משימות דחופות"><span aria-hidden="true">▲</span>${s.urgentTasks}</span>` : ""}
        ${s.possibleDischarges > 0 ? `<span class="mini info" title="${s.possibleDischarges} שחרורים אפשריים"><span aria-hidden="true">◆</span>${s.possibleDischarges}</span>` : ""}
        ${s.openTasks > 0 && s.urgentTasks === 0 && s.possibleDischarges === 0 ? `<span class="mini">${s.openTasks}</span>` : ""}
      </span>`;

  return `<button class="door-tile" ${unavailable ? "disabled" : `data-room="${room.id}"`} data-room-number="${room.number}" aria-label="${esc(description)}">
    <span class="door-crop"><span>${doorSlab(room.number, { dim: unavailable || empty })}</span></span>
    <span class="door-strip">
      <span>${esc(unavailable ? room.note || "אינו פעיל" : empty ? "פנוי" : `${s.patients} מטופלים`)}</span>
      ${chips}
    </span>
  </button>`;
}

/**
 * Entering a room: the clicked door is cloned at its exact on-screen position,
 * flown toward the viewer, swung open on its hinge, and walked through as the
 * light from the room floods past. Four beats, ~820ms end to end.
 */
function enterRoom(roomId, number, node) {
  const reduced = calm();
  if (reduced || !node) {
    go("room", roomId);
    return;
  }
  const r = node.getBoundingClientRect();
  const layer = document.createElement("div");
  layer.className = "door-transition";
  layer.setAttribute("role", "presentation");
  layer.setAttribute("aria-hidden", "true");
  layer.innerHTML = `<div class="flyer" style="top:${r.top}px;left:${r.left}px;width:${r.width}px;height:${r.height}px">${doorSlab(
    number,
    { style: "height:100%;aspect-ratio:auto;border-radius:var(--radius-card)" },
  )}</div><div class="flood"></div>`;
  // Appended inside #app so the RTL direction (and therefore the door's lever
  // side) is inherited, and so the overlay works when this file is embedded.
  app.appendChild(layer);

  const flyer = layer.querySelector(".flyer");
  const door = layer.querySelector(".door");
  const flood = layer.querySelector(".flood");

  // A door that fills a 16:9 screen stops reading as a door, so the clone grows
  // to a door-shaped box centred in the viewport rather than filling it.
  const th = Math.min(window.innerHeight * 0.92, 860);
  const tw = th * 0.8;

  const timers = [];
  timers.push(
    setTimeout(() => {
      flyer.style.top = `${(window.innerHeight - th) / 2}px`;
      flyer.style.left = `${(window.innerWidth - tw) / 2}px`;
      flyer.style.width = `${tw}px`;
      flyer.style.height = `${th}px`;
      door.classList.add("open");
    }, 230),
  );
  // The push through the doorway begins while the slab is still swinging —
  // waiting for it to finish is what makes this kind of transition drag.
  timers.push(
    setTimeout(() => {
      flyer.style.transitionDuration = "360ms";
      flyer.style.transform = "scale(2.6)";
      flood.style.opacity = "0.5";
    }, 470),
  );
  timers.push(
    setTimeout(() => {
      flyer.style.opacity = "0";
      flood.style.opacity = "1";
    }, 660),
  );
  timers.push(
    setTimeout(() => {
      layer.remove();
      go("room", roomId);
    }, 820),
  );
}

/* -------------------------------------------------------------- screen 2 --*/

function viewRoom() {
  const room = getRoom(state.roomId);
  if (!room) {
    return `${header({ back: { to: "rooms", label: "חזרה לחדרים" } })}
      <main id="main"><div class="ward">${emptyState(I.door(iconStyle(32)), "החדר לא נמצא", "ייתכן שהחדר הוסר מהמחלקה או שהקישור שגוי.")}</div></main>${footer()}`;
  }

  const list = roomPatients(room.id);
  const s = summariseRoom(room);
  const unavailable = room.status === "unavailable";

  const tiles = unavailable
    ? ""
    : `<ul class="tiles">
        ${summaryTile(I.user(iconStyle(20)), "מספר מטופלים", s.patients, 0)}
        ${summaryTile(I.clipboard(iconStyle(20)), "משימות פתוחות", s.openTasks, 1, s.urgentTasks > 0 ? `${s.urgentTasks} דחופות` : null)}
        ${summaryTile(I.heart(iconStyle(20)), "שחרורים אפשריים", s.possibleDischarges, 2)}
      </ul>`;

  const body = unavailable
    ? emptyState(
        I.door(iconStyle(32)),
        "החדר אינו פעיל",
        room.note ? `${room.note}. לא ניתן לשבץ מטופלים לחדר זה כרגע.` : "לא ניתן לשבץ מטופלים לחדר זה כרגע.",
      )
    : list.length === 0
      ? emptyState(I.clipboard(iconStyle(32)), "אין מטופלים בחדר", "החדר פנוי ומוכן לקליטה. מטופלים שישובצו יופיעו כאן.")
      : `<ul class="patient-list">${list
          .map((p, i) => `<li class="reveal" style="--d:${i + 3}">${patientCard(p)}</li>`)
          .join("")}</ul>`;

  return `
  ${header({ back: { to: "rooms", label: "חזרה לחדרים" } })}
  <main id="main"><div class="ward">
    <div style="margin-bottom:20px">
      <h1 class="room-title">חדר <span class="tnum">${room.number}</span></h1>
      <p class="room-sub">${esc(unavailable ? room.note || "אינו פעיל" : patientCount(list.length))}</p>
    </div>
    ${tiles}
    ${body}
  </div></main>
  ${footer()}`;
}

function summaryTile(icon, label, value, index, note) {
  return `<li class="reveal pop" style="--d:${index}"><div class="card tile">
    <span class="icon">${icon}</span>
    <span style="min-width:0">
      <span class="label">${esc(label)}</span>
      <span style="display:flex;align-items:baseline;gap:8px">
        <span class="value tnum${note ? " urgent" : ""}">${value}</span>
        ${note ? `<span class="note"><span aria-hidden="true">▲ </span>${esc(note)}</span>` : ""}
      </span>
    </span>
  </div></li>`;
}

/** One patient, as a single large target: the whole card is the link. On a
 *  tablet held in one hand during a round, a small "open" button is the wrong
 *  target. */
function patientCard(p) {
  const status = PATIENT_STATUS[p.status];
  const open = openTaskCount(p);
  const hasDraft = p.draftClinicalData !== null;

  return `<button class="patient-card" data-patient="${p.id}">
    <span class="bed">
      <span class="ring">${I.bed(iconStyle(20))}</span>
      <span class="txt">מיטה <span class="tnum">${p.bed}</span></span>
    </span>
    <span class="body">
      <span style="min-width:0;flex:1">
        <span style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px">
          <h3>${esc(p.name)}</h3>
          ${hasDraft ? `<span class="draft-chip">טיוטה פתוחה</span>` : ""}
        </span>
        <dl class="fields">
          ${field("גיל", p.age, true)}
          ${field("ת״ז", p.idNumber, true)}
          ${field("קופה", p.hmo)}
          ${field("אבחנה עיקרית", p.primaryDiagnosis)}
        </dl>
      </span>
      <span class="side">
        ${pill(status)}

}

function field(label, value, tnum) {
  return `<div class="field"><dt>${esc(label)}</dt><dd class="${tnum ? "tnum" : ""}" title="${esc(value)}">${esc(value)}</dd></div>`;
}

/* -------------------------------------------------------------- screen 3 --*/

function viewPatient() {

  if (!p) {
    return `${header({ back: { to: "rooms", label: "חזרה לחדרים" } })}
      <main id="main"><div class="ward">${emptyState(I.user(iconStyle(32)), "המטופל לא נמצא", "ייתכן שהמטופל שוחרר או שהקישור שגוי.")}</div></main>`;
  }

function dfield(label, value, tnum, emph) {

}

/* ------------------------------------------------------- clinical record --*/

/**
 * Eight permanent categories, always present, always in the same order,
 * populated or not. A doctor scanning for מדדים finds it in the same place on
 * every patient, every morning; that predictability is worth more than
 * collapsing empty sections would save.
 */
function clinicalRecord(p, animate) {
  const isDraft = p.draftClinicalData !== null;
  const d = activeData(p);
  const structuring = rec.phase === "structuring" && rec.patientId === p.id;
  const s = (i, title, icon, body, extra) => section(i, title, icon, body, extra, animate);

  const sections = [
    s(1, "תלונה עיקרית", I.chat(iconStyle(18)), list(p, "chiefComplaint", d.chiefComplaint, "לא תועדה תלונה עיקרית")),
    s(2, "מחלות רקע", I.document(iconStyle(18)), list(p, "pastMedicalHistory", d.pastMedicalHistory, "לא תועדו מחלות רקע")),
    s(3, "סטטוס סוציאלי", I.users(iconStyle(18)), list(p, "socialStatus", d.socialStatus, "לא תועד מידע סוציאלי")),
    s(4, "מדדים", I.vitals(iconStyle(18)), vitalsGrid(p, d)),
    s(
      5,
      "בדיקות",
      I.flask(iconStyle(18)),
      `<div class="sub-grid">${TEST_SUBSECTIONS.map(
        (sub) => `<div><h4>${esc(sub.title)}</h4>${list(p, `tests.${sub.key}`, d.tests[sub.key], "—")}</div>`,
      ).join("")}</div>`,
    ),
    // Visually distinct from the primary diagnosis in the header strip: that
    // one is the admission label, this is what the treating doctor currently
    // believes, and they are not the same claim.
    s(6, "אבחנת עבודה", I.stethoscope(iconStyle(18)), list(p, "workingDiagnosis", d.workingDiagnosis, "טרם נקבעה אבחנת עבודה"), "dx"),
    s(7, "תכנית טיפול", I.document(iconStyle(18)), list(p, "treatmentPlan", d.treatmentPlan, "לא הוגדרה תכנית טיפול")),
    s(8, "אחר / הערות", I.document(iconStyle(18)), list(p, "other", d.other, "אין הערות", "הוספת הערה")),
  ].join("");

  return `<div style="display:flex;flex-direction:column;gap:16px">
    ${d.needsReview.length > 0 ? needsReviewPanel(p, d) : ""}
    <div class="record${structuring ? " scanning" : ""}">${sections}</div>
    ${isDraft ? `<p class="draft-note">שינויים נשמרים בטיוטה בלבד. המידע ייכנס לרשומה רק לאחר אישור הסבב.</p>` : ""}
  </div>`;
}

/** `animate` is false on every re-render after the first: the sections already
 *  exist on screen, and re-arming the reveal would leave anything currently
 *  above the viewport stuck at opacity 0 — an observer never fires for an
 *  element the reader has already scrolled past. */
function section(index, title, icon, body, extra, animate) {
  return `<section class="section${animate ? " reveal" : ""}${extra ? ` ${extra}` : ""}" style="--d:${index}">
    <h3><span class="badge">${icon}</span><span class="name"><span class="tnum">${index}.</span> ${esc(title)}</span></h3>
    <div class="body">${body}</div>
  </section>`;
}

/** A list of clinical lines, each independently editable. The unit of
 *  correction is the line, not the section. */
function list(p, path, items, empty, addLabel) {
  const editing = state.editing;
  const rows = items
    .map((entry) => {
      if (editing && editing.kind === "item" && editing.path === path && editing.id === entry.id) {
        return `<li>${inlineInput(entry.text, "", { kind: "item", path, id: entry.id })}</li>`;
      }
      const fresh = isFresh(entry.addedAt);
      return `<li class="item${entry.source === "ai" ? " ai" : ""}${fresh ? " reveal shown settle" : ""}">
        <span class="dot" aria-hidden="true"></span>
        <span class="text">${esc(entry.text)}${entry.source === "ai" ? `<span class="ai-tag" style="margin-inline-start:8px">טיוטת AI</span>` : ""}</span>
        <span class="tools">
          <button class="icon-btn sm" aria-label="עריכה" title="עריכה" data-edit-item="${entry.id}" data-path="${path}">${I.pencil(iconStyle(15))}</button>
          <button class="icon-btn sm danger" aria-label="מחיקה" title="מחיקה" data-del-item="${entry.id}" data-path="${path}">${I.trash(iconStyle(15))}</button>
        </span>
      </li>`;
    })
    .join("");

  const adding = editing && editing.kind === "add" && editing.path === path;

  return `<div class="items">
    ${items.length === 0 && !adding ? `<p class="empty-line">${esc(empty)}</p>` : ""}
    ${items.length > 0 ? `<ul class="items">${rows}</ul>` : ""}
    ${
      adding
        ? inlineInput("", "הוספת שורה…", { kind: "add", path })
        : `<button class="add-line" data-add-item="${path}">${I.plus(iconStyle(16))}${esc(addLabel || "הוספה")}</button>`
    }
  </div>`;
}

function inlineInput(value, placeholder, target) {
  return `<div class="inline-edit">
    <input type="text" value="${esc(value)}" placeholder="${esc(placeholder || "")}" data-editor="1" />
    <button class="icon-btn" aria-label="שמירה" title="שמירה" data-save="1" style="color:var(--stable)">${I.check(iconStyle(16))}</button>
  </div>`;
}

function vitalsGrid(p, d) {
  return `<ul class="vitals">${VITAL_ORDER.map((key) => vitalCard(p, key, d.vitals[key])).join("")}</ul>`;
}

function vitalCard(p, key, reading) {
  const meta = VITAL_LABELS[key];
  const editing = state.editing && state.editing.kind === "vital" && state.editing.key === key;
  const fresh = reading && isFresh(reading.addedAt);

  return `<li class="vital${reading ? "" : " unset"}${fresh ? " settle" : ""}">
    <span class="top">
      <span class="lbl">${esc(meta.label)}</span>
      <span class="tools"><button class="icon-btn sm" aria-label="עריכת ${esc(meta.label)}" data-edit-vital="${key}">${I.pencil(iconStyle(13))}</button></span>
    </span>
    ${
      editing
        ? inlineInput(reading ? reading.value : "", meta.unit, { kind: "vital", key })
        : reading
          ? `<span class="val tnum">${esc(reading.value)}</span>`
          : `<button class="none" data-edit-vital="${key}">לא נמדד</button>`
    }
  </li>`;
}

/**
 * The uncertainty surface. When the transcript or the extractor is not
 * confident, content lands here — visible, labelled and attributable — instead
 * of being guessed into a clinical category or silently dropped. Both of those
 * failures are worse than an unresolved flag.
 */
function needsReviewPanel(p, d) {
  return `<section class="review-panel">
    <h3>${I.alert(iconStyle(18))}דורש בדיקה<span class="pill sm tone-attention tnum">${d.needsReview.length}</span></h3>
    <ul>${d.needsReview
      .map(
        (entry) => `<li>
          <span style="min-width:0;flex:1">
            <span style="display:block;font-size:14px">${esc(entry.text)}</span>
            <span class="why">${esc(entry.reason)}</span>
          </span>
          <span style="display:flex;flex-shrink:0;align-items:center;gap:4px">
            <button class="move" data-review-move="${entry.id}">העברה להערות</button>
            <button class="icon-btn danger" aria-label="מחיקה" data-review-drop="${entry.id}">${I.trash(iconStyle(15))}</button>
          </span>
        </li>`,
      )
      .join("")}</ul>
  </section>`;
}

/* ---------------------------------------------------- operational column --*/

function operationalColumn(p) {
  return `<div class="ops">
    ${tasksPanel(p)}
    ${consultsPanel(p)}
    ${dischargePanel(p)}
    ${blockersPanel(p)}
    ${draftPanel(p)}
  </div>`;
}

function tasksPanel(p) {
  const tasks = activeTasks(p);
  const sorted = tasks.slice().sort((a, b) => {
    if ((a.status === "done") !== (b.status === "done")) return a.status === "done" ? 1 : -1;
    return PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority];
  });
  const open = tasks.filter((t) => t.status !== "done").length;
  const adding = state.editing && state.editing.kind === "addTask";

  return `<section class="card">
    ${panelHead(I.clipboard(iconStyle(18)), "משימות", countBadge(open === 0 ? "אין פתוחות" : `${open} פתוחות`, open > 0 ? "attention" : "neutral"))}
    ${
      sorted.length === 0
        ? `<p class="none">לא נוצרו משימות עבור מטופל זה.</p>`
        : `<ul class="rows">${sorted.map((t) => taskRow(p, t)).join("")}</ul>`
    }
    <div class="foot">
      ${
        adding
          ? inlineInput("", "משימה חדשה…", { kind: "addTask" })
          : `<button class="add-line" data-add-task="1">${I.plus(iconStyle(16))}הוספת משימה</button>`
      }
    </div>
  </section>`;
}

function taskRow(p, t) {
  const done = t.status === "done";

/** A blocker is "cleared by" a task when their wording overlaps. The link is a
 *  suggestion, never automatic: clearing a discharge blocker is a clinical
 *  decision, so the app offers and the human confirms. */
function clearingTask(blockerText, tasks) {
  const words = blockerText
    .replace(/[^\p{L}\p{N}\s-]/gu, " ")
    .split(/\s+/)
    .filter((w) => w.length >= 3);
  return tasks.find((t) => {
    if (t.status !== "done") return false;
    const title = t.title.toLowerCase();
    return words.some((w) => title.includes(w.toLowerCase()));
  });
}

/**
 * Deliberately not the entry point — the ward is navigated by room, and this is
 * the sweep you do once the round is done. It answers a different question: not
 * "what does this patient need" but "what is still open anywhere".
 */
const TASK_FILTERS = [
  ["all", "הכל"],
  ["urgent", "דחוף"],
  ["today", "היום"],
  ["pending", "ממתין"],
  ["done", "בוצע"],
  ["discharge", "שחרור"],
];

function viewTasks() {
  const rows = [];
  for (const p of Object.values(ward.patients)) {
    for (const t of activeTasks(p)) {
      rows.push({ task: t, patient: p, roomNumber: getRoom(p.roomId).number });
    }
  }
  rows.sort((a, b) => {
    if ((a.task.status === "done") !== (b.task.status === "done")) return a.task.status === "done" ? 1 : -1;
    const p = PRIORITY_RANK[a.task.priority] - PRIORITY_RANK[b.task.priority];
    return p !== 0 ? p : a.roomNumber - b.roomNumber;
  });

  const dischargeRows = Object.values(ward.patients)
    .filter((p) => {
      const d = activeDischarge(p);
      return d.status === "today" || d.status === "tomorrow";
    })
    .sort((a, b) => a.name.localeCompare(b.name, "he"));

  const counts = {
    all: rows.length,
    urgent: rows.filter((r) => r.task.priority === "urgent" && r.task.status !== "done").length,
    today: rows.filter((r) => r.task.priority === "today" && r.task.status !== "done").length,
    pending: rows.filter((r) => r.task.status !== "done").length,
    done: rows.filter((r) => r.task.status === "done").length,
    discharge: dischargeRows.length,
  };

  const f = state.taskFilter;
  const visible =
    f === "urgent"
      ? rows.filter((r) => r.task.priority === "urgent" && r.task.status !== "done")
      : f === "today"
        ? rows.filter((r) => r.task.priority === "today" && r.task.status !== "done")
        : f === "pending"
          ? rows.filter((r) => r.task.status !== "done")
          : f === "done"
            ? rows.filter((r) => r.task.status === "done")
            : rows;

  let body;
  if (f === "discharge") {
    body =
      dischargeRows.length === 0
        ? emptyState(I.heart(iconStyle(32)), "אין שחרורים מתוכננים", "מטופלים שיסומנו לשחרור היום או מחר יופיעו כאן.")
        : `<ul class="task-rows">${dischargeRows.map(dischargeRow).join("")}</ul>`;
  } else if (visible.length === 0) {
    body = emptyState(I.clipboard(iconStyle(32)), "אין משימות בתצוגה זו", "בחרו סינון אחר כדי לראות משימות נוספות.");
  } else {
    body = `<ul class="task-rows tight">${visible.map(taskBoardRow).join("")}</ul>`;
  }

  return `
  ${header({ back: { to: "rooms", label: "חזרה לחדרים" } })}
  <main id="main"><div class="ward">
    <h1 class="room-title">משימות המחלקה</h1>
    <p class="room-sub">${counts.pending === 0 ? "אין משימות פתוחות במחלקה" : `${counts.pending} משימות פתוחות`}</p>

    <div class="filters" role="tablist" aria-label="סינון משימות">${TASK_FILTERS.map(
      ([key, label]) =>
        `<button class="filter-chip${f === key ? " on" : ""}" role="tab" aria-selected="${f === key}" data-filter="${key}">${esc(label)}<span class="tnum" style="opacity:.7">${counts[key]}</span></button>`,
    ).join("")}</div>

    ${body}
  </div></main>
  ${footer()}`;
}
